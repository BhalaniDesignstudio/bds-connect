<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDS Connect</title>
    <!-- Add favicon for URL tab -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-animation"></div>
    
    <main class="container">
        <header class="profile-section">
            <div class="profile-image-container">
                <img src="logo.png" alt="Bhalani Design Studio Logo" class="profile-logo">
            </div>
            <h1 class="name">Bhalani Design Studio</h1>
            <p class="bio">Welcome! Connect with us below.</p>
        </header>

        <section class="links-section">
            <a href="https://wa.me/918866550514" target="_blank" rel="noopener noreferrer" class="link-card whatsapp" id="link-whatsapp">
                <div class="icon-wrapper">
                    <i class="fa-brands fa-whatsapp"></i>
                </div>
                <span class="link-title">WhatsApp</span>
            </a>

            <a href="https://www.instagram.com/bhalani_Design_studio/" target="_blank" rel="noopener noreferrer" class="link-card instagram" id="link-instagram">
                <div class="icon-wrapper">
                    <i class="fa-brands fa-instagram"></i>
                </div>
                <span class="link-title">Instagram</span>
            </a>

            <a href="mailto:contact.bds3@gmail.com" class="link-card gmail" id="link-gmail">
                <div class="icon-wrapper">
                    <i class="fa-regular fa-envelope"></i>
                </div>
                <span class="link-title">Email Us</span>
            </a>

            <a href="https://www.bhalanidesignstudio.com" target="_blank" rel="noopener noreferrer" class="link-card website" id="link-website">
                <div class="icon-wrapper">
                    <i class="fa-solid fa-globe"></i>
                </div>
                <span class="link-title">Visit Website</span>
            </a>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
